<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark background -->
  <rect width="512" height="512" rx="70" fill="#1A1A10"/>

  <!-- KAFT logo: Large K with chess knight + king overlaid -->

  <!-- K left vertical bar -->
  <rect x="72" y="68" width="95" height="376" rx="14" fill="#FFD700"/>

  <!-- K upper arm (diagonal going upper-right) -->
  <polygon points="167,258 167,190 415,68 330,68" fill="#FFD700"/>

  <!-- K lower arm (diagonal going lower-right) -->
  <polygon points="167,258 167,326 415,444 330,444" fill="#FFD700"/>

  <!-- Chess KNIGHT body (occupies upper K area) -->
  <!-- Neck/base -->
  <rect x="185" y="210" width="108" height="95" rx="10" fill="#FFD700"/>
  <!-- Head body (horse) -->
  <ellipse cx="295" cy="172" rx="72" ry="86" fill="#FFD700" transform="rotate(12 295 172)"/>
  <!-- Muzzle hollow -->
  <ellipse cx="335" cy="152" rx="46" ry="60" fill="#1A1A10" transform="rotate(12 335 152)"/>
  <!-- Nostril -->
  <circle cx="368" cy="190" r="10" fill="#1A1A10" transform="rotate(12 368 190)"/>
  <!-- Eye -->
  <circle cx="272" cy="150" r="12" fill="#1A1A10"/>
  <circle cx="275" cy="147" r="5" fill="#FFD700"/>

  <!-- Chess KING crown on top of knight -->
  <!-- Crown base -->
  <rect x="236" y="88" width="100" height="18" rx="5" fill="#FFD700"/>
  <!-- Crown spikes -->
  <rect x="240" y="58" width="18" height="34" rx="4" fill="#FFD700"/>
  <rect x="265" y="50" width="18" height="42" rx="4" fill="#FFD700"/>
  <rect x="290" y="58" width="18" height="34" rx="4" fill="#FFD700"/>
  <rect x="315" y="58" width="18" height="34" rx="4" fill="#FFD700"/>
  <!-- Cross on top of center spike -->
  <rect x="269" y="32" width="10" height="22" rx="2" fill="#FFD700"/>
  <rect x="260" y="40" width="28" height="10" rx="2" fill="#FFD700"/>

  <!-- Chessboard squares (bottom-right accent) -->
  <rect x="315" y="350" width="40" height="40" rx="5" fill="#FFD700" opacity="0.28"/>
  <rect x="358" y="350" width="40" height="40" rx="5" fill="#FFD700" opacity="0.62"/>
  <rect x="315" y="393" width="40" height="40" rx="5" fill="#FFD700" opacity="0.62"/>
  <rect x="358" y="393" width="40" height="40" rx="5" fill="#FFD700" opacity="0.28"/>
</svg>
